# Smithery configuration (https://smithery.ai/docs/config#smitheryyaml)
startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    properties: {}
  command:
    type: "stdio"
    # Dockerfile.smithery 预装了 Python 引擎依赖，启动即用
    command: node
    args:
      - bin/guarddog-mcp.js
